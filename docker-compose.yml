services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: contahora
      POSTGRES_PASSWORD: contahora
      POSTGRES_DB: contahora
    ports:
      # 5433 no host para não conflitar com um Postgres nativo em 5432
      - "5433:5432"
    volumes:
      - contahora_pgdata:/var/lib/postgresql/data

volumes:
  contahora_pgdata:
